[project]
name = "rpa-orchestrator"
version = "0.1.0"
description = "Orquestador Python para bots RPA expuestos por API REST."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "arq>=0.26.3",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "motor>=3.7.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.40",
    "structlog>=25.2.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
